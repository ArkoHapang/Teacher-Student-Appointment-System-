app = "ts-appointment-system"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "5000"
  API_PREFIX = "/api/v1"
  DB_CLIENT = "sqlite"
  DB_FILE = "/data/appointment_system.db"
  JWT_EXPIRES_IN = "24h"
  LOG_LEVEL = "info"

[mounts]
  source = "sqlite_data"
  destination = "/data"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/v1/health"
