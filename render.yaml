
services:
  - type: web
    name: ts-appointment-system
    runtime: docker
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: DB_CLIENT
        value: sqlite
      - key: DB_FILE
        value: /data/appointment_system.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: LOG_LEVEL
        value: info
