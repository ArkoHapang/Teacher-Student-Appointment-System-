# ==============================================================================
# Netlify Configuration
# University Teacher-Student Appointment System (Frontend Service)
# ==============================================================================

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# Same-origin API proxy to the persistent Fly.io backend.
# Keeping API traffic on the Netlify origin supports the application's
# HttpOnly session cookies and credentialed requests.
[[redirects]]
  from = "/api/*"
  to = "https://ts-appointment-system.fly.dev/api/:splat"
  status = 200
  force = true

# Single Page Application fallback (keep this rule last).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
