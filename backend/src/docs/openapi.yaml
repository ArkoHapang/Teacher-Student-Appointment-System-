        actorId:
          type: integer
          example: 1
        action:
          type: string
          example: UPDATE_USER_STATUS
        entityType:
          type: string
          example: USER
        entityId:
          type: string
          example: "6"
        details:
          type: string
          example: '{"previous":"ACTIVE","updated":"SUSPENDED"}'
