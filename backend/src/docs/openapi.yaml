  responses:
    BadRequestError:
      description: Bad Request — Request validation failure, invalid syntax, or missing mandatory parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    UnauthorizedError:
      description: Unauthorized — Authentication credentials missing, forged, expired, or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    ForbiddenError:
      description: Forbidden — Insufficient role permissions, resource ownership mismatch, or CSRF validation rejection.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    NotFoundError:
      description: Not Found — The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    ConflictError:
      description: Conflict — Resource state conflict (duplicate email, overlapping availability slot, or double-booked consultation).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    TooManyRequestsError:
      description: Too Many Requests — Rate limit threshold exceeded for authentication attempts.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    InternalServerError:
      description: Internal Server Error — An unexpected server exception occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    ServiceUnavailableError:
      description: Service Unavailable — Database or critical subsystem offline during readiness probe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
