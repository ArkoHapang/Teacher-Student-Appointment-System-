        newStatus:
          type: string
          example: APPROVED
        actorId:
          type: integer
          example: 2
        actorRole:
          type: string
          example: TEACHER
        notes:
          type: string
          nullable: true
          example: Please bring your rough sketches to the meeting.
        createdAt:
          type: string
          example: "2026-10-24 16:15:00"

    Notification:
      type: object
      properties:
        id:
          type: integer
