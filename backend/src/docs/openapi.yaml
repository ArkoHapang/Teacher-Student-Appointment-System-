openapi: 3.0.3
info:
  title: University Teacher-Student Appointment System API
  version: 1.0.0
  description: |
    Comprehensive OpenAPI 3.0.3 specification for the University Teacher–Student Appointment System.
    Provides complete documentation for student consultation scheduling, teacher availability management,
    appointment lifecycle state transitions, conflict prevention, real-time Server-Sent Events (SSE) notifications,
    post-consultation feedback ratings, and administrative audit logging.

    ### Architecture & Deployment
    Unified full-stack Express & SQLite/PostgreSQL service deployed via Docker container on Render / Cloud hosting.
    All API endpoints are mounted under the `/api/v1` namespace.

    ### Authentication Mechanisms
    1. **HttpOnly Cookie Authentication**:
       Session cookie named `token` set by server upon successful login (`/api/v1/auth/login`) or registration (`/api/v1/auth/register`).
       The browser automatically delivers this cookie on same-origin requests (`withCredentials: true`).
    2. **Bearer JWT Header**:
       Standard `Authorization: Bearer <jwt-token>` header for programmatic API consumers and non-browser clients.

    ### Anti-CSRF Protection
    For browser clients utilizing cookie-based authentication, all state-changing HTTP operations
    (`POST`, `PUT`, `PATCH`, `DELETE`) strictly require:
    - Custom Header: `X-Requested-With: XMLHttpRequest`
    - Valid `Origin` header matching trusted deployment origins.
servers:
  - url: /
    description: Current Host (Unified Production / Render Deployment)
  - url: http://localhost:5000
    description: Local Development Server

tags:
  - name: System
    description: Liveness, readiness, and API catalog diagnostic endpoints
  - name: Authentication
    description: User registration, credential login, token revocation, identity inspection, and session verification
  - name: Departments
    description: Academic department listings and directory
  - name: Users
    description: User account profile management and notification read state operations
  - name: Teachers
    description: Faculty directory exploration, availability slot configuration, and schedule management
  - name: Appointments
    description: Consultation booking, status lifecycle transitions, conflict checking, and history
  - name: Feedback
    description: Student post-consultation ratings and reviews
  - name: Notifications
    description: Real-time Server-Sent Events (SSE) notification streaming
  - name: Administration
    description: Administrative user management, teacher approval, system audit logs, and appointment oversight

paths:
  /api/v1/:
    get:
      tags: [System]
      summary: API Root Catalog
      description: Returns service metadata, current timestamp, and available API module entry points.
      operationId: getApiCatalog
      responses:
        '200':
          description: API catalog metadata returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCatalogResponse'

  /api/v1/health:
    get:
      tags: [System]
      summary: Liveness Probe
      description: Basic healthcheck endpoint returning process uptime, memory usage, and server timestamp.
      operationId: getHealthStatus
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'

  /api/v1/ready:
    get:
      tags: [System]
      summary: Readiness Probe
      description: Deep healthcheck verifying database connectivity and migration status.
      operationId: getReadinessStatus
      responses:
        '200':
          description: Database and application subsystems are ready to accept traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Student Self-Registration
      description: Atomically creates a user account with STUDENT role and an associated student profile. Sets secure HttpOnly session cookie (`token`).
      operationId: registerStudent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterStudentRequest'
      responses:
        '201':
          description: Student registration successful.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieAuth'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          description: Conflict — User email or student ID number already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: User Login
      description: Authenticates user credentials (email and password), returning a JWT access token and setting a secure HttpOnly session cookie (`token`).
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieAuth'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden — Account is suspended or pending administrator approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: User Logout (POST)
      description: Revokes JWT access token server-side in `revoked_tokens` table, wipes session cookies, and emits storage-clearing headers.
      operationId: logoutUserPost
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      responses:
        '200':
          description: Successfully logged out.
          headers:
            Clear-Site-Data:
              schema:
                type: string
                example: '"cache", "cookies", "storage"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    get:
      tags: [Authentication]
      summary: User Logout (GET)
      description: Allows logout via browser navigation redirect or JSON response.
      operationId: logoutUserGet
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: redirect
          in: query
          required: false
          schema:
            type: boolean
          description: When true, redirects browser (302) to `/login`.
      responses:
        '200':
          description: Successfully logged out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '302':
          description: Redirected to login page.
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: Current User Profile
      description: Returns identity, role, and associated profile record (student or teacher) of the currently authenticated user.
      operationId: getCurrentUserProfile
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Current authenticated user identity profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/auth/verify:
    get:
      tags: [Authentication]
      summary: Verify Session Token
      description: Confirms that the current authentication token or session cookie is valid and active.
      operationId: verifyAuthenticationState
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Token is valid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      valid:
                        type: boolean
                        example: true
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/departments:
    get:
      tags: [Departments]
      summary: List Academic Departments
      description: Public directory of university departments.
      operationId: listDepartments
      responses:
        '200':
          description: List of academic departments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentListResponse'

  /api/v1/users/{id}:
    get:
      tags: [Users]
      summary: Get User Profile by ID
      description: Retrieves basic user profile fields. Restricted to the user themselves or an administrator.
      operationId: getUserProfile
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userIdParam'
      responses:
        '200':
          description: User profile details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [Users]
      summary: Update User Profile
      description: Updates editable user account fields (`firstName`, `lastName`). Restricted to the user themselves or an administrator.
      operationId: updateUserProfile
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userIdParam'
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: User profile successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/users/{id}/notifications:
    get:
      tags: [Users]
      summary: List User Notifications
      description: Retrieves persistent in-app notifications for the specified user. Restricted to the user themselves or an administrator.
      operationId: getUserNotifications
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userIdParam'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: unreadOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Paginated notification list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/users/{id}/notifications/read-all:
    patch:
      tags: [Users]
      summary: Mark All Notifications as Read (PATCH)
      description: Idempotently marks all unread notifications as read for the authenticated recipient user.
      operationId: markAllNotificationsReadPatch
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userIdParam'
        - $ref: '#/components/parameters/csrfHeader'
      responses:
        '200':
          description: All notifications marked as read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkAllNotificationsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/users/{id}/notifications/mark-all-read:
    post:
      tags: [Users]
      summary: Mark All Notifications as Read (POST Alias)
      description: Alias endpoint to idempotently mark all notifications as read.
      operationId: markAllNotificationsReadPost
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userIdParam'
        - $ref: '#/components/parameters/csrfHeader'
      responses:
        '200':
          description: All notifications marked as read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkAllNotificationsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/users/{id}/notifications/{notificationId}/read:
    patch:
      tags: [Users]
      summary: Mark Notification as Read
      description: Idempotently marks a single notification as read. Enforces strict recipient ownership matching authenticated user ID.
      operationId: markNotificationRead
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userIdParam'
        - $ref: '#/components/parameters/notificationIdParam'
        - $ref: '#/components/parameters/csrfHeader'
      responses:
        '200':
          description: Notification marked as read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/users/{id}/notifications/{notificationId}:
    patch:
      tags: [Users]
      summary: Mark Notification as Read (Alias)
      description: Alias endpoint to mark an individual notification as read.
      operationId: markNotificationReadAlias
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userIdParam'
        - $ref: '#/components/parameters/notificationIdParam'
        - $ref: '#/components/parameters/csrfHeader'
      responses:
        '200':
          description: Notification marked as read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/teachers:
    get:
      tags: [Teachers]
      summary: List Faculty Directory
      description: Public directory of university faculty members with department filters, search, and pagination.
      operationId: listTeachersDirectory
      parameters:
        - name: departmentId
          in: query
          required: false
          schema:
            type: integer
          description: Filter faculty by department ID
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search by teacher name or email
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of faculty members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherListResponse'

  /api/v1/teachers/{id}:
    get:
      tags: [Teachers]
      summary: Get Teacher Details
      description: Retrieves comprehensive teacher profile including department, office room, bio, and assigned courses.
      operationId: getTeacherDetails
      parameters:
        - $ref: '#/components/parameters/teacherIdParam'
      responses:
        '200':
          description: Teacher details returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherDetailResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [Teachers]
      summary: Update Teacher Profile
      description: Allows a faculty member to update their own professional profile fields (`designation`, `officeRoom`, `bio`).
      operationId: updateTeacherProfile
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/teacherIdParam'
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeacherProfileRequest'
      responses:
        '200':
          description: Teacher profile updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/teachers/{id}/slots:
    get:
      tags: [Teachers]
      summary: Get Faculty Availability Slots
      description: Publicly lists availability slots for a faculty member. By default returns future open slots (`is_available = 1`).
      operationId: getTeacherAvailabilitySlots
      parameters:
        - $ref: '#/components/parameters/teacherIdParam'
        - name: all
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true, returns all slots regardless of availability
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter slots starting on or after YYYY-MM-DD
      responses:
        '200':
          description: Availability slots returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotListResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      tags: [Teachers]
      summary: Create Availability Slot
      description: Creates a new consultation availability slot for a teacher. Checks for overlapping intervals on the same date.
      operationId: createTeacherAvailabilitySlot
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/teacherIdParam'
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAvailabilitySlotRequest'
      responses:
        '201':
          description: Availability slot created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Conflict — Slot time interval collides with existing slot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/teachers/{id}/slots/{slotId}:
    patch:
      tags: [Teachers]
      summary: Update Availability Slot Status
      description: Toggles availability slot active status (`isActive: true|false`). Restricted to slot owner or admin.
      operationId: updateTeacherAvailabilitySlot
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/teacherIdParam'
        - $ref: '#/components/parameters/slotIdParam'
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAvailabilitySlotRequest'
      responses:
        '200':
          description: Slot updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags: [Teachers]
      summary: Delete Availability Slot
      description: Permanently removes an open availability slot. Fails if reserved by an active appointment.
      operationId: deleteTeacherAvailabilitySlot
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/teacherIdParam'
        - $ref: '#/components/parameters/slotIdParam'
        - $ref: '#/components/parameters/csrfHeader'
      responses:
        '200':
          description: Slot deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Slot deleted successfully.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Conflict — Slot cannot be deleted because it is reserved by an active consultation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/appointments/check-conflict:
    post:
      tags: [Appointments]
      summary: Check Booking Conflict
      description: Evaluates whether a proposed availability slot is open and verifies student and teacher have no overlapping appointments.
      operationId: checkAppointmentConflict
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckConflictRequest'
      responses:
        '200':
          description: Conflict check completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckConflictResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/appointments:
    get:
      tags: [Appointments]
      summary: List User Appointments
      description: Returns scoped appointments for the authenticated user (students see booked consultations, faculty members see incoming requests, admins see all).
      operationId: listAppointments
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED, CANCELLED, COMPLETED, RESCHEDULE_PENDING]
        - name: studentId
          in: query
          required: false
          schema:
            type: integer
          description: Admin filter by student ID
        - name: teacherId
          in: query
          required: false
          schema:
            type: integer
          description: Admin filter by teacher ID
      responses:
        '200':
          description: Appointments list returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Appointments]
      summary: Book Appointment
      description: Authenticated student books an open faculty consultation slot. Sets status to PENDING and marks slot unavailable.
      operationId: bookAppointment
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppointmentRequest'
      responses:
        '201':
          description: Consultation appointment booked successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden — Only authenticated students can book consultations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Conflict — Slot is already booked or student has a concurrent appointment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/appointments/{id}:
    get:
      tags: [Appointments]
      summary: Get Appointment Details
      description: Retrieves complete appointment details including participant identities, slot timestamps, and current lifecycle status.
      operationId: getAppointmentDetails
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/appointmentIdParam'
      responses:
        '200':
          description: Appointment details returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/appointments/{id}/approve:
    post:
      tags: [Appointments]
      summary: Approve Appointment
      description: Assigned faculty member or admin approves a PENDING appointment (`PENDING -> APPROVED`).
      operationId: approveAppointment
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/appointmentIdParam'
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveAppointmentRequest'
