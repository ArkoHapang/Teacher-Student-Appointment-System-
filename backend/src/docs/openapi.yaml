          type: string
          example: admin@university.edu
        firstName:
          type: string
          example: System
        lastName:
          type: string
          example: Administrator

    RegisterStudentRequest:
      type: object
      required: [email, password, firstName, lastName, studentIdNumber, departmentId]
      properties:
        email:
          type: string
          format: email
          minLength: 5
          maxLength: 255
          example: student@university.edu
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          example: Password123!
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          example: Jane
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          example: Doe
        studentIdNumber:
          type: string
          minLength: 2
          maxLength: 50
          example: STU-2026-0042
        departmentId:
          type: integer
          example: 1

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
