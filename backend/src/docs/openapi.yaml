        cancellationReason:
          type: string
          nullable: true
          example: null
        cancelledBy:
          type: string
          nullable: true
          example: null
        createdAt:
          type: string
          example: "2026-10-24 16:00:00"
        updatedAt:
          type: string
          example: "2026-10-24 16:00:00"
        studentFirstName:
          type: string
          example: Jane
        studentLastName:
          type: string
          example: Doe
        studentEmail:
          type: string
          example: jane.doe@university.edu
        studentIdNumber:
          type: string
          example: STU-2026-0042
        teacherFirstName:
          type: string
          example: Robert
        teacherLastName:
          type: string
          example: Miller
        teacherEmail:
          type: string
          example: robert.miller@university.edu
        officeRoom:
          type: string
          example: UB-401
        designation:
          type: string
          example: Associate Professor
        slotDate:
          type: string
          example: "2027-09-15"
        startTime:
          type: string
          example: "10:00"
        endTime:
          type: string
          example: "10:30"
        startTimestamp:
          type: string
          example: "2027-09-15 10:00:00"
        endTimestamp:
          type: string
          example: "2027-09-15 10:30:00"

    AppointmentHistory:
      type: object
      properties:
        id:
          type: integer
          example: 1
        appointmentId:
          type: integer
          example: 822
        action:
          type: string
          example: STATUS_CHANGE
