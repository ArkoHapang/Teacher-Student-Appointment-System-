        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/admin/appointments/{id}/complete:
    post:
      tags: [Administration]
      summary: Admin Complete Appointment
      description: Administrator marks an APPROVED consultation as COMPLETED.
      operationId: adminCompleteAppointment
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/appointmentIdParam'
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteAppointmentRequest'
      responses:
        '200':
          description: Appointment completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: |
        Secure HttpOnly session cookie containing a signed JWT access token.
        Automatically managed and attached by web browsers on same-origin requests (`withCredentials: true`).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Standard HTTP Bearer authorization header (`Authorization: Bearer <token>`) for API clients.

  parameters:
    csrfHeader:
      name: X-Requested-With
      in: header
      required: false
      schema:
        type: string
        enum: [XMLHttpRequest]
        example: XMLHttpRequest
      description: Mandatory anti-CSRF custom header required on state-changing operations (`POST`, `PUT`, `PATCH`, `DELETE`) when authenticating via HttpOnly session cookies.
    userIdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Numeric user ID
    teacherIdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Numeric teacher profile ID or user ID
    appointmentIdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Numeric appointment ID
    slotIdParam:
      name: slotId
      in: path
      required: true
      schema:
        type: integer
      description: Numeric availability slot ID
    notificationIdParam:
      name: notificationId
      in: path
      required: true
      schema:
        type: integer
      description: Numeric notification ID

  headers:
    SetCookieAuth:
      description: HttpOnly session cookie containing signed JWT access token.
      schema:
        type: string
        example: token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...; Path=/; HttpOnly; SameSite=Strict

  schemas:
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: AUTHENTICATION_REQUIRED
            message:
              type: string
              example: Authorization header with Bearer token is required.
            details:
              type: array
              items:
                type: string
              example: []

    SuccessEnvelope:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully.
        data:
          type: object

    User:
      type: object
      properties:
        id:
          type: integer
          example: 2
        email:
          type: string
          format: email
          example: robert.miller@university.edu
        firstName:
          type: string
          example: Robert
        lastName:
          type: string
          example: Miller
        role:
          type: string
          enum: [STUDENT, TEACHER, ADMIN]
          example: TEACHER
        status:
          type: string
          enum: [ACTIVE, PENDING_APPROVAL, SUSPENDED]
          example: ACTIVE

    StudentProfile:
      type: object
      properties:
        id:
          type: integer
          example: 1
        userId:
          type: integer
          example: 3
        studentIdNumber:
          type: string
          example: STU-2026-0042
        departmentId:
          type: integer
          example: 1
        departmentName:
          type: string
          example: Computer Science and Engineering
        departmentCode:
          type: string
          example: CSE

    TeacherProfile:
      type: object
      properties:
        id:
          type: integer
          example: 1
        userId:
          type: integer
          example: 2
        departmentId:
          type: integer
          example: 1
        departmentName:
          type: string
          example: Computer Science and Engineering
        departmentCode:
          type: string
          example: CSE
        designation:
          type: string
          example: Associate Professor
        officeRoom:
          type: string
          example: UB-401
        bio:
          type: string
          nullable: true
          example: Research focuses on distributed algorithms and cloud database design.
        isVerified:
          type: integer
          enum: [0, 1]
          example: 1
        courses:
          type: array
          items:
            type: string
          example: [CSE101, CSE311]

    Department:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Computer Science and Engineering
        code:
          type: string
          example: CSE
        description:
          type: string
          nullable: true
          example: School of Computing and Information Systems.

    AvailabilitySlot:
      type: object
      properties:
        id:
          type: integer
          example: 101
        teacherId:
          type: integer
          example: 1
        slotDate:
          type: string
          format: date
          example: "2027-09-15"
        startTime:
          type: string
          example: "10:00"
        endTime:
          type: string
          example: "10:30"
        startTimestamp:
          type: string
          example: "2027-09-15 10:00:00"
        endTimestamp:
          type: string
          example: "2027-09-15 10:30:00"
        isAvailable:
          type: integer
          enum: [0, 1]
          example: 1
        isActive:
          type: integer
          enum: [0, 1]
          example: 1

    Appointment:
      type: object
      properties:
        id:
          type: integer
          example: 822
        studentId:
          type: integer
          example: 1
        teacherId:
          type: integer
          example: 1
        slotId:
          type: integer
          example: 101
        title:
          type: string
          example: Algorithm Project Review
        purpose:
          type: string
          example: Guidance regarding graph optimization and time complexity.
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, CANCELLED, COMPLETED, RESCHEDULE_PENDING]
