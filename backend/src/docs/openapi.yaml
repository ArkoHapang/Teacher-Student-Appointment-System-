                $ref: '#/components/schemas/AppointmentResponse'
        '400':
          description: Bad Request — Invalid status transition or constraint violation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/admin/appointments/{id}/reschedule:
    post:
      tags: [Administration]
      summary: Admin Reschedule Consultation
      description: Moves appointment to another open slot of the same faculty member with audit logging.
      operationId: adminRescheduleAppointment
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/appointmentIdParam'
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleAppointmentRequest'
      responses:
        '200':
          description: Appointment rescheduled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/v1/admin/appointments/{id}/approve:
    post:
      tags: [Administration]
      summary: Admin Approve Appointment
      description: Administrator approves a PENDING appointment.
      operationId: adminApproveAppointment
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/appointmentIdParam'
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveAppointmentRequest'
      responses:
        '200':
          description: Appointment approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/admin/appointments/{id}/reject:
    post:
      tags: [Administration]
      summary: Admin Reject Appointment
      description: Administrator rejects a PENDING appointment and releases the reserved slot.
      operationId: adminRejectAppointment
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/appointmentIdParam'
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectAppointmentRequest'
      responses:
        '200':
          description: Appointment rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/admin/appointments/{id}/cancel:
    post:
      tags: [Administration]
      summary: Admin Cancel Appointment
      description: Administrator cancels a consultation and releases the availability slot.
      operationId: adminCancelAppointment
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/appointmentIdParam'
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
