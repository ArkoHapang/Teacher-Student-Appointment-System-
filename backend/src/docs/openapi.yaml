  /api/v1/notifications/stream:
    get:
      tags: [Notifications]
      summary: Real-Time SSE Notification Stream
      description: |
        Establishes an authenticated Server-Sent Events (SSE) notification stream.
        Maintains a persistent HTTP connection (`Connection: keep-alive`) sending text/event-stream data frames.

        ### Protocol Lifecycle
        1. **Handshake**: Server transmits `event: connected` payload with user ID and timestamp upon connection establishment.
        2. **Notification Events**: When notifications are generated for the authenticated user, server pushes `event: notification` with serialized JSON payload.
        3. **Heartbeat Keep-Alive**: Periodically transmits comment frames (`:keepalive\n\n`) every 25 seconds to prevent browser/proxy timeouts.
        4. **Connection Isolation**: Strictly scoped to the authenticated user's ID; foreign notifications are never multiplexed.
      operationId: streamRealtimeNotifications
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Real-time event stream active.
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event: connected
                  data: {"connected":true,"userId":6,"timestamp":"2026-11-11T12:00:00.000Z"}

                  :keepalive

                  id: 105
                  event: notification
                  data: {"id":105,"recipientId":6,"appointmentId":42,"title":"Appointment Approved","message":"Consultation approved.","type":"STATUS_UPDATE","isRead":0}
        '401':
          $ref: '#/components/responses/UnauthorizedError'

