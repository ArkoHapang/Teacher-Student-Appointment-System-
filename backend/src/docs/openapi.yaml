          type: string
          format: password
          example: Password123!

    UpdateUserProfileRequest:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          example: Jane
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          example: Doe

    CreateAvailabilitySlotRequest:
      type: object
      required: [slotDate, startTime, endTime]
      properties:
        slotDate:
          type: string
          format: date
          example: "2027-09-15"
        startTime:
          type: string
          pattern: ^\d{2}:\d{2}(:\d{2})?$
          example: "10:00"
        endTime:
          type: string
          pattern: ^\d{2}:\d{2}(:\d{2})?$
          example: "10:30"

    UpdateAvailabilitySlotRequest:
      type: object
      required: [isActive]
      properties:
        isActive:
          type: boolean
          example: true

    UpdateTeacherProfileRequest:
      type: object
      properties:
        designation:
          type: string
          example: Associate Professor
        officeRoom:
          type: string
          example: UB-401
        bio:
          type: string
          example: Focused on distributed systems and software architecture.

    CheckConflictRequest:
